<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarketRank Fluxscape</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="panel">
    <h1><img class="logo" src="favicon.svg" alt="" width="34" height="34"><span class="brand"><span class="name">MarketRank</span><span class="view">Fluxscape</span></span></h1>
    <div id="status">loading…</div>
    <h2>Data</h2>
    <label>Bar <input id="scrub" type="range" min="0" max="0" value="0"></label>
    <label>Follow latest <input id="follow" type="checkbox" checked></label>
    <button id="play">Play</button>
    <h2>View</h2>
    <label>Height scale <input id="hscale" type="range" min="0.1" max="3" step="0.1" value="1"></label>
    <label>Labels <input id="labels" type="checkbox" checked></label>
    <label>Show ETF clusters <input id="showEtf" type="checkbox"></label>
    <h2>Portfolio</h2>
    <div id="holdings" class="list"></div>
    <h2>Shock</h2>
    <label>Ticker <input id="shockTicker" type="text" list="tickers" placeholder="NVDA"></label>
    <datalist id="tickers"></datalist>
    <label>Size (%) <input id="shockSize" type="range" min="-20" max="20" step="1" value="-10"></label>
    <div id="shockSizeLabel">-10%</div>
    <button id="shockApply">Apply shock</button><button id="shockReset">Reset</button>
    <div id="shockHint" class="hint" hidden>shock applies to the latest bar</div>
    <div id="shockOut" class="list"></div>
  </aside>
  <main id="canvas">
    <section id="top" aria-live="polite">
      <h3>MarketRank top 10 · π (exact)</h3>
      <div id="topRows"></div>
    </section>
    <section id="path" hidden>
      <h3><span id="pathTitle"></span><button id="pathClose" title="close" aria-label="close">×</button></h3>
      <svg id="pathSvg" viewBox="0 0 360 250" role="img"></svg>
      <div id="pathNote" class="hint"></div>
    </section>
    <div id="legend"></div>
  </main>
</div>
<script src="https://unpkg.com/deck.gl@9.4.0/dist.min.js" integrity="sha384-NrpHmp6N6IhXZ+gSV+uRLo+Hqprkw4BfdGzmxgWXhjakjkAabyfQxokSmn/aK0VB" crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
