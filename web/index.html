<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarketRank Fluxscape</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <main id="stage">
    <section id="viewport">
      <div id="viewbar" role="toolbar" aria-label="view">
        <button data-view="3d">3D</button><button data-view="top">Top</button><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="sections" class="on">Sections</button>
        <button id="viewReset" class="ghost" title="reset the camera">⟲</button>
        <button id="viewOptsBtn" class="ghost" title="view options" aria-expanded="false">⚙</button>
        <button class="ghost maxbtn" data-max="viewport" title="expand / collapse (Esc)">⤢</button>
      </div>
      <div id="viewopts" class="pop" hidden>
        <label>Height scale <input id="hscale" type="range" min="0.1" max="3" step="0.1" value="1"></label>
        <label>Ticker labels <input id="labels" type="checkbox" checked></label>
        <label>Show ETF clusters <input id="showEtf" type="checkbox"></label>
      </div>
      <div id="timebar" role="group" aria-label="time">
        <button id="play" title="play the cached history">▶</button>
        <input id="scrub" type="range" min="0" max="0" value="0" aria-label="bar">
        <span id="barDate">—</span>
      </div>
      <div id="canvas"><div id="legend"></div></div>
      <div id="sections" title="click or drag on the map to move the cuts; arrow keys step them (Shift: 5)">
        <div class="sec"><h4 id="secXTitle"></h4><svg id="secX" viewBox="0 0 600 170" preserveAspectRatio="none"></svg></div>
        <div class="sec"><h4 id="secYTitle"></h4><svg id="secY" viewBox="0 0 600 170" preserveAspectRatio="none"></svg></div>
      </div>
    </section>
    <aside id="side">
      <section id="brand" class="card">
        <h1><img class="logo" src="favicon.svg" alt="" width="40" height="40"><span class="brand"><span class="name">MarketRank</span><span class="view">Fluxscape</span></span></h1>
        <div id="status">loading…</div>
      </section>
      <section id="top" aria-live="polite">
        <h3><span>MarketRank top 10 · π (exact) <span class="sub">· click rows to compare</span></span><span class="tools"><button class="maxbtn" data-max="top" title="expand / collapse (Esc)">⤢</button></span></h3>
        <div id="topRows"></div>
      </section>
      <section id="track">
        <form id="trackForm" autocomplete="off"><input id="trackInput" list="tickers" placeholder="Track a ticker… (e.g. COST)" aria-label="ticker to track"><button type="submit">Add</button></form>
        <div id="trackMsg" class="hint"></div>
      </section>
      <section id="path" hidden>
        <h3><span id="pathTitle"></span><span class="tools"><button class="maxbtn" data-max="path" title="expand / collapse (Esc)">⤢</button><button id="pathClose" title="clear the selection" aria-label="clear">×</button></span></h3>
        <div id="pathLegend"></div>
        <svg id="pathSvg" viewBox="0 0 360 250" role="img"></svg>
        <div id="pathNote" class="hint"></div>
      </section>
      <section id="graph" hidden>
        <h3><span id="graphTitle">Flow graph</span><span class="tools"><button class="maxbtn" data-max="graph" title="expand / collapse (Esc)">⤢</button></span></h3>
        <svg id="graphSvg" role="img"></svg>
        <div id="graphNote" class="hint"></div>
      </section>
      <section id="portfolio" class="card">
        <h3><span>Portfolio</span><span class="tools"><button id="pfEditBtn" class="textbtn" title="enter your own holdings">Edit</button></span></h3>
        <div id="holdings" class="list"></div>
        <div id="pfEdit" hidden>
          <div id="pfRows"></div>
          <div class="pfbar"><button id="pfAdd" class="textbtn">+ Add holding</button><span id="pfSum" class="hint"></span></div>
          <div class="pfbar"><button id="pfSave" class="primary">Save</button><button id="pfCancel" class="textbtn">Cancel</button></div>
          <div id="pfMsg" class="hint"></div>
        </div>
      </section>
      <section id="shock" class="card">
        <h3><span>Shock</span></h3>
        <div class="row"><label>Ticker <input id="shockTicker" type="text" list="tickers" placeholder="NVDA"></label>
          <label>Size <input id="shockSize" type="range" min="-20" max="20" step="1" value="-10"> <span id="shockSizeLabel">-10%</span></label></div>
        <datalist id="tickers"></datalist>
        <div class="pfbar"><button id="shockApply" class="primary">Apply shock</button><button id="shockReset" class="textbtn">Reset</button></div>
        <div id="shockHint" class="hint" hidden>shock applies to the latest bar</div>
        <div id="shockOut" class="list"></div>
      </section>
    </aside>
  </main>
</div>
<script src="https://unpkg.com/deck.gl@9.4.0/dist.min.js" integrity="sha384-NrpHmp6N6IhXZ+gSV+uRLo+Hqprkw4BfdGzmxgWXhjakjkAabyfQxokSmn/aK0VB" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
