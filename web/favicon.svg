<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="3" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <g fill="none" stroke="#38bdf8" stroke-linecap="butt">
    <!-- fish body: two crossing arcs, arrows on the tail ends -->
    <path d="M9 45 Q34 1 56 31" stroke-width="2.8" marker-start="url(#arrow)"/>
    <path d="M9 17 Q34 61 56 31" stroke-width="2.8" marker-start="url(#arrow)"/>
    <!-- legs: one edge each, arrow at the foot -->
    <line x1="28.5" y1="40.4" x2="23.3" y2="52" stroke-width="2.6" marker-end="url(#arrow)"/>
    <line x1="38" y1="43.2" x2="42.5" y2="52" stroke-width="2.6" marker-end="url(#arrow)"/>
  </g>
  <!-- Sowilo rune -->
  <path d="M38 22 L31 29 L39 33 L32 40" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
